{{- if not .Values.auth.existingSecret }}
{{- fail "auth.existingSecret est obligatoire : créer d'abord un Secret portant AK_ADMIN_TOKEN (voir values.yaml)" }}
{{- end }}
{{- $sources := 0 }}
{{- range (list .Values.decks.configMap .Values.decks.persistentVolumeClaim .Values.decks.image.reference) }}{{ if . }}{{ $sources = add1 $sources }}{{ end }}{{ end }}
{{- if gt $sources 1 }}
{{- fail "decks.configMap, decks.persistentVolumeClaim et decks.image.reference sont exclusifs" }}
{{- end }}
{{- if hasPrefix "/" .Values.decks.image.path }}
{{- fail "decks.image.path est relatif à la racine de l'image : sans slash initial (ex. usr/share/nginx/html)" }}
{{- end }}
{{- $decks := or .Values.decks.configMap .Values.decks.persistentVolumeClaim .Values.decks.image.reference }}
{{- $state := .Values.persistence.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ak.fullname" . }}
  labels:
    {{- include "ak.labels" . | nindent 4 }}
spec:
  # Un seul pod, et ce n'est pas un réglage : la séance est en mémoire (et
  # son volume de sauvegarde ne s'attache qu'à un pod).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ak.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- if $state }}
        # le volume de sauvegarde doit être inscriptible par l'uid non-root
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audience-keeper
          image: {{ include "ak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AK_ADDR
              value: ":8080"
            - name: AK_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: AK_ADMIN_TOKEN
            - name: AK_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: AK_MCP_TOKEN
                  optional: true
            - name: AK_MCP_SHOW_NAMES
              value: {{ .Values.mcp.showNames | quote }}
            {{- with include "ak.publicURL" . }}
            - name: AK_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $decks }}
            - name: AK_DECKS_DIR
              value: /decks
            {{- end }}
            {{- if $state }}
            - name: AK_STATE_FILE
              value: /data/session.json
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or $decks $state }}
          volumeMounts:
            {{- if $decks }}
            - name: decks
              mountPath: /decks
              readOnly: true
              {{- if and .Values.decks.image.reference .Values.decks.image.path }}
              subPath: {{ .Values.decks.image.path }}
              {{- end }}
            {{- end }}
            {{- if $state }}
            - name: state
              mountPath: /data
            {{- end }}
          {{- end }}
      {{- if or $decks $state }}
      volumes:
        {{- if $state }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-state" (include "ak.fullname" .)) }}
        {{- end }}
        {{- if $decks }}
        - name: decks
          {{- if .Values.decks.configMap }}
          configMap:
            name: {{ .Values.decks.configMap }}
          {{- else if .Values.decks.image.reference }}
          image:
            reference: {{ .Values.decks.image.reference }}
            pullPolicy: {{ .Values.decks.image.pullPolicy }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.decks.persistentVolumeClaim }}
            readOnly: true
          {{- end }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
