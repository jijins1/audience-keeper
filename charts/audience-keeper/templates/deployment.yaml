{{- if not .Values.auth.existingSecret }}
{{- fail "auth.existingSecret est obligatoire : créer d'abord un Secret portant AK_ADMIN_TOKEN (voir values.yaml)" }}
{{- end }}
{{- if and .Values.decks.configMap .Values.decks.persistentVolumeClaim }}
{{- fail "decks.configMap et decks.persistentVolumeClaim sont exclusifs" }}
{{- end }}
{{- $decks := or .Values.decks.configMap .Values.decks.persistentVolumeClaim }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ak.fullname" . }}
  labels:
    {{- include "ak.labels" . | nindent 4 }}
spec:
  # Un seul pod, et ce n'est pas un réglage : la séance est en mémoire.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ak.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audience-keeper
          image: {{ include "ak.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AK_ADDR
              value: ":8080"
            - name: AK_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: AK_ADMIN_TOKEN
            - name: AK_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: AK_MCP_TOKEN
                  optional: true
            - name: AK_MCP_SHOW_NAMES
              value: {{ .Values.mcp.showNames | quote }}
            {{- with include "ak.publicURL" . }}
            - name: AK_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $decks }}
            - name: AK_DECKS_DIR
              value: /decks
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if $decks }}
          volumeMounts:
            - name: decks
              mountPath: /decks
              readOnly: true
          {{- end }}
      {{- if $decks }}
      volumes:
        - name: decks
          {{- if .Values.decks.configMap }}
          configMap:
            name: {{ .Values.decks.configMap }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ .Values.decks.persistentVolumeClaim }}
            readOnly: true
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
