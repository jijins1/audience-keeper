<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audience Keeper</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/reveal/reveal.js" defer></script>
  <script src="/static/slideview.js" defer></script>
  <script src="/static/student.js" defer></script>
</head>
<body>
  <main class="student">
    <header>
      <h1>Audience Keeper</h1>
      <span class="spacer"></span>
      <span id="me" class="muted hidden"><span id="dot" class="status-dot"></span> <span id="me-name"></span></span>
    </header>

    <section id="slide-box" class="slide-box hidden" aria-label="Diaporama en direct">
      <div class="reveal"><div class="slides"></div></div>
    </section>

    <section id="join" class="panel hidden">
      <h2>Rejoindre la séance</h2>
      <form id="join-form">
        <label for="code">Code de la séance</label>
        <input id="code" name="code" autocomplete="off" autocapitalize="characters" maxlength="12" required>
        <label for="pseudo">Ton prénom ou pseudo</label>
        <input id="pseudo" name="pseudo" maxlength="32" required>
        <p id="join-error" class="error hidden"></p>
        <p><button class="primary" type="submit">Rejoindre</button></p>
      </form>
    </section>

    <section id="wait" class="panel hidden">
      <h2>Tu es connecté·e ✓</h2>
      <p class="muted">En attente de la prochaine question…</p>
    </section>

    <section id="question" class="panel hidden">
      <div id="q-title" class="question-title"></div>
      <div id="q-input"></div>
      <div class="row">
        <button id="submit" class="primary" type="button">Envoyer</button>
        <span id="q-status" class="muted"></span>
      </div>
    </section>

    <section id="messages" class="messages"></section>
  </main>
</body>
</html>
